<style>
  :root {
    --navy-bg: #0b1420;
    --navy-card: #131e2e;
    --navy-card-2: #1a2740;
    --gold: #d9a441;
    --gold-light: #f0c76b;
    --text: #eef2f7;
    --text-dim: #9aa7bb;
    --green: #3ecf8e;
    --red: #e5615a;
    --border: #22314a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center;
    background: var(--navy-bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 18px 0 40px;
  }
  .ficha { width: 100%; max-width: 420px; padding: 0 14px; }
  .carrusel-wrap { position: relative; border-radius: 16px; overflow: hidden; background: var(--navy-card); border: 1px solid var(--border); }
  .carrusel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .carrusel::-webkit-scrollbar { display: none; }
  .carrusel img { flex: 0 0 100%; scroll-snap-align: start; width: 100%; height: 260px; object-fit: cover; display: block; }
  .foto-contador {
    position: absolute; top: 10px; right: 10px; background: rgba(11,20,32,.65);
    color: #fff; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
  }
  .dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.4); transition: background .2s; cursor: pointer; }
  .dots span.activo { background: var(--gold); }
  .carrusel-flecha {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(11,20,32,.55); color: #fff; font-size: 20px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .carrusel-flecha:hover { background: rgba(11,20,32,.8); }
  .carrusel-flecha.izq { left: 8px; }
  .carrusel-flecha.der { right: 8px; }
  .badge-pill {
    display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
    margin: 16px 0 6px;
  }
  .badge-pill.disponible { background: rgba(62,207,142,.15); color: var(--green); }
  .badge-pill.por_ingresar { background: rgba(217,164,65,.18); color: var(--gold-light); }
  .badge-pill.en_reparacion { background: rgba(229,97,90,.15); color: var(--red); }
  .badge-pill.vendido { background: rgba(154,167,187,.18); color: var(--text-dim); }
  h1 { font-size: 20px; line-height: 1.25; margin: 4px 0 2px; color: var(--text); }
  .subtitulo { color: var(--text-dim); font-size: 13px; margin-bottom: 14px; }
  .precio { font-size: 32px; font-weight: 800; color: var(--text); margin: 6px 0 2px; }
  .condiciones { color: var(--text-dim); font-size: 13px; margin-bottom: 18px; }
  .panel { background: var(--navy-card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .panel h2 { margin: 0 0 12px; font-size: 12px; color: var(--gold-light); text-transform: uppercase; letter-spacing: .05em; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 10px; }
  .info-grid .dato-full { grid-column: 1 / -1; }
  .info-grid .etiqueta { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 3px; }
  .info-grid .valor { color: var(--text); font-size: 14px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--navy-card-2); border: 1px solid var(--border); border-radius: 999px; padding: 5px 10px; font-size: 12px; color: var(--text); }
  .btn-whatsapp {
    display: block; text-align: center; background: var(--green); color: #0b1420; font-weight: 700;
    padding: 14px; border-radius: 12px; text-decoration: none; font-size: 15px; margin-top: 6px;
  }
  .agencia-footer { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
  .agencia-footer img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .agencia-footer-nombre { font-size: 13px; font-weight: 700; color: var(--text); }
  .agencia-footer-dato { font-size: 12px; color: var(--text-dim); }
  .agencia-footer-redes { display: flex; gap: 10px; margin-top: 2px; }
  .agencia-footer-redes a { color: var(--gold-light); font-size: 12px; text-decoration: none; }
  .btn-volver {
    display: inline-flex; align-items: center; gap: 6px; margin: 0 0 12px; padding: 8px 14px;
    background: var(--navy-card); border: 1px solid var(--border); border-radius: 999px;
    color: var(--gold-light); font-size: 14px; font-weight: 700; text-decoration: none;
  }
</style>
