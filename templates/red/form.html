{% extends "base.html" %}
{% block title %}Nueva publicación — Red de Agencieros{% endblock %}
{% block header %}Publicar en la Red de Agencieros{% endblock %}
{% block content %}
<div class="panel">
  <form method="post">
    <div class="form-row">
      <div><label>Tu agencia</label><input value="{{ session.get('agencia_nombre','') }}" disabled></div>
      <div>
        <label>Tipo de publicación</label>
        <select name="tipo">
          <option value="ofrezco">Ofrezco un vehículo</option>
          <option value="busco">Busco un vehículo</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div><label>Año</label><input type="number" id="anio" name="anio"></div>
      <div><label>Marca</label><select id="marca" name="marca" data-placeholder-libre="Marca nueva"></select></div>
      <div><label>Modelo</label><select id="modelo" name="modelo" data-placeholder-libre="Modelo nuevo"></select></div>
      <div><label>Versión</label><select id="version" name="version" data-placeholder-libre="Versión nueva"></select></div>
    </div>
    <div class="form-row">
      <div><label>Km</label><input type="number" name="km" placeholder="ej. 45.000"></div>
      <div><label>Precio</label><input type="number" step="0.01" name="precio"></div>
      <div>
        <label>Contacto</label>
        <input value="{{ contacto or 'Sin nombre ni teléfono cargados -- completalos en Admin' }}" disabled>
      </div>
    </div>
    <label>Descripción</label>
    <textarea name="descripcion"></textarea>
    <button class="btn btn-primary" style="margin-top:20px;" type="submit">Publicar</button>
  </form>
</div>
<script src="{{ url_for('static', filename='js/autocomplete.js') }}"></script>
<script src="{{ url_for('static', filename='js/catalogo.js') }}"></script>
<script>
  const catalogo = {{ catalogo_json | safe }};
  initCatalogoSelects(catalogo, 'anio', 'marca', 'modelo', 'version');
</script>
{% endblock %}
