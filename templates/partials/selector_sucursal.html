{# Selector de sucursal (29/09/2026). Solo aparece si la agencia tiene 2+ sucursales.
   Usa: sucursales_sel, sucursal_sel, y `suc_endpoint` + `suc_args` para armar los links. #}
{% if sucursales_sel %}
<div class="selector-sucursal">
  <span class="selector-sucursal-label">Sucursal:</span>
  <a class="chip {{ 'active' if sucursal_sel is none else '' }}" href="{{ url_for(suc_endpoint, suc='todas', **(suc_args or {})) }}">Todas</a>
  {% for s in sucursales_sel %}
  <a class="chip {{ 'active' if sucursal_sel == s.id else '' }}" href="{{ url_for(suc_endpoint, suc=s.id, **(suc_args or {})) }}">{{ s.nombre }}</a>
  {% endfor %}
</div>
{% endif %}
