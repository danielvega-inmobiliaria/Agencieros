<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificá tu mail — Agencieros</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div style="max-width:380px; margin:80px auto; padding:0 16px;">
    <div class="brand" style="border:none; text-align:center; margin-bottom:24px;">AGENCIEROS<span>Verificá tu cuenta</span></div>
    <div class="panel">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <p style="font-size:.9rem; color:#a9b4c8;">
        Te mandamos un código de 6 dígitos a <strong>{{ email }}</strong>. Vence en 15 minutos.
      </p>
      <form method="post">
        <label>Código</label>
        <input type="text" name="codigo" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus
               style="letter-spacing:8px; font-size:1.4rem; text-align:center;">
        <button class="btn btn-primary" style="width:100%; margin-top:20px;" type="submit">Verificar</button>
      </form>
      <p style="text-align:center; margin-top:18px; font-size:.9rem;">
        ¿No te llegó? <a href="{{ url_for('auth.reenviar_codigo') }}">Reenviar código</a>
      </p>
    </div>
  </div>
</body>
</html>
